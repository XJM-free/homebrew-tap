name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax

      - name: Test pull request formula changes
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Locate claude-agent-ledger formula
        id: ledger-formula
        if: github.event_name != 'pull_request'
        env:
          TAP_REPOSITORY: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          test -n "$TAP_REPOSITORY"
          test -d "$TAP_REPOSITORY"
          # Container tap checkouts live outside GITHUB_WORKSPACE.
          if [[ -f "$TAP_REPOSITORY/Formula/claude-agent-ledger.rb" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ledger formula absent; installation test not run."
          fi

      - name: Test claude-agent-ledger from selected ref
        if: github.event_name != 'pull_request' && steps.ledger-formula.outputs.present == 'true'
        run: brew test-bot --only-formulae "${{ steps.set-up-homebrew.outputs.tap-name }}/claude-agent-ledger"

      - name: Verify claude-agent-ledger uninstall
        if: github.event_name != 'pull_request' && steps.ledger-formula.outputs.present == 'true'
        env:
          LEDGER_FORMULA: ${{ steps.set-up-homebrew.outputs.tap-name }}/claude-agent-ledger
        run: |
          # test-bot leaves the tested bottle installed. Require that state so
          # an absent installation cannot pass this cleanup acceptance check.
          brew list --versions "$LEDGER_FORMULA"
          prefix="$(brew --prefix)"
          cellar="$(brew --cellar claude-agent-ledger)"
          executable="$prefix/bin/agent-ledger"
          opt_link="$prefix/opt/claude-agent-ledger"
          test -x "$executable"
          test -L "$opt_link"
          test -d "$cellar"

          HOMEBREW_NO_AUTOREMOVE=1 brew uninstall --formula --force "$LEDGER_FORMULA"
          for installed_path in "$executable" "$opt_link" "$cellar"; do
            test ! -e "$installed_path"
            test ! -L "$installed_path"
          done
          echo "Ledger executable, opt link, and Cellar directory removed."

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
